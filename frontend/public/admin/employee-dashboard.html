<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فضاء الموظف</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="employee-dashboard-page">
    <header class="manager-header">
      <div>
        <p class="eyebrow owner-brand-title">GLOSSIA GROUPS SYSTEM</p>
        <h1 id="employee-welcome">مرحبا</h1>
        <p id="employee-post-label" class="employee-header-post"></p>
      </div>
      <div class="manager-header-actions">
        <div class="sync-toolbar" data-sync-toolbar>
          <span class="sync-status is-pending" data-sync-status>القاعدة: كنتأكد...</span>
          <span class="sync-last" data-sync-last>آخر مزامنة: --</span>
          <button class="manager-btn manager-btn-muted sync-now-btn" data-sync-now type="button">زامن دابا</button>
        </div>
        <a id="employee-logout" href="login.html" class="logout-btn">خروج</a>
      </div>
    </header>

    <section class="employee-dashboard-section" aria-labelledby="hours-heading">
      <div class="employee-section-heading">
        <div>
          <p class="eyebrow">وقت الخدمة</p>
          <h2 id="hours-heading">الساعات ديالي</h2>
        </div>

        <div class="period-tabs" role="tablist" aria-label="فترة الملخص">
          <button type="button" class="period-tab active" data-period="day" aria-selected="true">اليوم</button>
          <button type="button" class="period-tab" data-period="week" aria-selected="false">السيمانة</button>
          <button type="button" class="period-tab" data-period="month" aria-selected="false">الشهر</button>
        </div>
      </div>

      <div id="employee-hours-summary" class="employee-summary-grid"></div>
    </section>

    <section class="employee-dashboard-section" aria-labelledby="history-heading">
      <div class="employee-section-heading">
        <div>
          <p class="eyebrow">التسجيلات الأخيرة</p>
          <h2 id="history-heading">التاريخ اليومي</h2>
        </div>
      </div>

      <div class="employee-table-wrap">
        <table class="employee-history-table">
          <thead>
            <tr>
              <th>التاريخ</th>
              <th>الوصول</th>
              <th>الوقفة</th>
              <th>الرجوع</th>
              <th>المغادرة</th>
              <th>الخدمة</th>
              <th>الحالة</th>
            </tr>
          </thead>
          <tbody id="employee-history-body"></tbody>
        </table>
      </div>
    </section>

    <div class="employee-dashboard-columns">
      <section class="employee-dashboard-section" aria-labelledby="sales-heading">
        <div class="employee-section-heading">
          <div>
            <p class="eyebrow">النتائج ديالي</p>
            <h2 id="sales-heading">البنفيس ديالي</h2>
          </div>
        </div>

        <div class="employee-net-benefit-card">
          <span>البنفيس الصافي (بعد الضريبة)</span>
          <strong id="employee-net-benefit">0,00 DH</strong>
          <small id="employee-net-benefit-detail"></small>
        </div>

        <div id="employee-benefit-toggle" class="employee-benefit-toggle">
          <button type="button" class="manager-btn manager-btn-muted benefit-type-btn active" data-type="service">الخدمات</button>
          <button type="button" class="manager-btn manager-btn-muted benefit-type-btn" data-type="product">المنتوجات</button>
        </div>

        <ul id="employee-benefit-list" class="employee-simple-list"></ul>
      </section>

      <section class="employee-dashboard-section" aria-labelledby="tasks-heading">
        <div class="employee-section-heading">
          <div>
            <p class="eyebrow">للإطلاع</p>
            <h2 id="tasks-heading">التاش ديالي</h2>
          </div>
          <span class="readonly-badge">قراءة فقط</span>
        </div>

        <div id="employee-task-list" class="employee-readonly-tasks"></div>
      </section>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="app-storage.js"></script>
  <script src="sync-ui.js"></script>
  <script src="employee-dashboard.js"></script>
  <script src="premium-ui.js"></script>
</body>
</html>
